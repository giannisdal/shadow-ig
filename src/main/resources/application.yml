server:
  port: ${SERVER_PORT:8081}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: instagram-monitor
  datasource:
    url: jdbc:h2:file:./data/instagram-monitor
    driver-class-name: org.h2.Driver
    username: sa
    password:
  sql:
    init:
      mode: always
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

instagram:
  monitoring:
    enabled: true
    provider: storiesig
    cron: ${INSTAGRAM_MONITOR_CRON:0 0 21 * * *}
    zone: Europe/Athens
    polling-interval: 24h
    notify-on-startup: true
    max-items-per-account: 10
    request-timeout: 30s
    max-retries: 3
    retry-backoff: 2s
    accounts: ${INSTAGRAM_USERNAMES:${INSTAGRAM_USERNAME:}}

notifications:
  email:
    enabled: true
    recipient: ${NOTIFICATION_EMAIL_RECIPIENT:giannisdalamaras@gmail.com}
    sender: ${NOTIFICATION_EMAIL_SENDER:onboarding@resend.dev}
    max-retries: 3
    retry-backoff: 2s

resend:
  api-key: ${RESEND_API_KEY:}

storiesig:
  api-key: ${STORIESIG_API_KEY:}
  base-url: https://scraperapi.to/scrape/instagram-scraper
